version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@11.18.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter web exec next build --webpack
            - rm -rf /tmp/web-deploy apps/web/node_modules
            - pnpm --filter web deploy --prod --legacy /tmp/web-deploy
            - mkdir -p apps/web/node_modules
            - cp -a /tmp/web-deploy/node_modules/. apps/web/node_modules/
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*
          - .pnpm-store/**/*
          - apps/web/.next/cache/**/*
